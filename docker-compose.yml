services:
  postgres:
    image: postgres:16-alpine
    container_name: senus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senus_dev}
      POSTGRES_DB: ${POSTGRES_DB:-senus_board}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-senus} -d ${POSTGRES_DB:-senus_board}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: senus-api
    # Secrets (GROQ_API_KEY, etc.) come from backend/.env, which is git-ignored.
    env_file:
      - ./backend/.env
    environment:
      # Point the API at the postgres service (overrides backend/.env).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-senus}:${POSTGRES_PASSWORD:-senus_dev}@postgres:5432/${POSTGRES_DB:-senus_board}
      # Set SEED_FROM_DISK=false to start with an empty database (useful for
      # demo videos). Set to "true" (or remove) to load the fixture periods
      # from backend/scripts/extracted/ on boot.
      SEED_FROM_DISK: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - uploads:/app/data/uploads
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: senus-frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
    external: true
    name: senus_plc_board_postgres_data
  uploads:
    external: true
    name: senus_plc_board_uploads
